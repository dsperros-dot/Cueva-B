<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cueva B - POS Estable</title>
    <style>
        :root { --bg: #0d0d0d; --card: #1a1a1a; --text: #e0e0e0; --accent: #00ff88; --gold: #ffcc00; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }
        .app-header { background: #000; padding: 15px; border-bottom: 2px solid var(--accent); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        #login-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 90vh; }
        #main-app { display: none; padding: 20px; }
        .main-layout { display: grid; grid-template-columns: 1fr 320px; gap: 20px; max-width: 1600px; margin: auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        .btn-prod { padding: 12px; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; height: 115px; transition: 0.1s; color: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .stock-badge { background: rgba(0,0,0,0.8); color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 11px; margin-top: 8px; display: block; }
        .panel { background: var(--card); padding: 20px; border-radius: 15px; border: 1px solid #333; margin-top: 20px; }
        .stat-card { background: #000; padding: 20px; border-radius: 10px; border-left: 5px solid var(--accent); margin-bottom: 10px; }
        .stat-card h4 { margin: 0; font-size: 12px; color: #888; text-transform: uppercase; }
        .stat-card p { margin: 5px 0 0; font-size: 28px; font-weight: bold; color: var(--accent); }
        .filter-box { background: #222; padding: 12px; border-radius: 10px; margin-bottom: 15px; display: flex; gap: 10px; align-items: center; }
        .input-date { background: #000; color: #fff; border: 1px solid #444; padding: 8px; border-radius: 5px; }
        .ticket-section { background: #fff; color: #000; padding: 20px; border-radius: 10px; font-family: 'Courier New', monospace; height: fit-content; position: sticky; top: 80px; }
        .btn-ui { width: 100%; padding: 14px; margin: 6px 0; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1rem; }
        .inv-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .inv-table input { background: #000; color: #fff; border: 1px solid #444; padding: 4px; width: 60px; border-radius: 4px; }
        .switch-container { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; background: #eee; padding: 10px; border-radius: 8px; font-size: 12px; font-weight: bold; color:#000; }
        @media print { body * { visibility: hidden; } #area-impresion, #area-impresion * { visibility: visible; } #area-impresion { position: absolute; left: 0; top: 0; width: 100%; } button, .no-print { display: none !important; } }
    </style>
</head>
<body>

    <header class="app-header">
        <div style="color: var(--accent); font-weight: bold; font-size: 1.4rem;">CUEVA B</div>
        <div id="user-display" style="color: var(--gold); font-weight: bold;"></div>
        <button onclick="location.reload()" style="background: #333; color: #fff; border: none; padding: 5px 12px; border-radius: 5px; cursor: pointer;">Cerrar Sesión</button>
    </header>

    <div id="login-screen">
        <div style="background: var(--card); padding: 40px; border-radius: 30px; border: 1px solid #333; width: 280px; text-align: center;">
            <button class="btn-ui" style="background: #444; color: white;" onclick="entrarComo('vendedor')">👤 VENDEDOR</button>
            <button class="btn-ui" style="background: var(--accent); color: #000;" onclick="entrarComo('dueno')">🔑 PROPIETARIO</button>
        </div>
    </div>

    <div id="main-app">
        <div class="main-layout">
            <div class="menu-section">
                <div class="grid" id="grid-ventas"></div>
                
                <div class="panel">
                    <h3 style="margin-top:0; color: var(--gold);">📊 Reporte de Ventas</h3>
                    <div class="filter-box">
                        <input type="date" id="f-inicio" class="input-date">
                        <input type="date" id="f-fin" class="input-date">
                        <button onclick="filtrarVentas()" style="background: var(--accent); border:none; padding:8px 15px; border-radius:5px; font-weight:bold; cursor:pointer; color:#000;">FILTRAR</button>
                    </div>
                    <div class="stat-card">
                        <h4>VENTA TOTAL</h4>
                        <p id="stat-ingreso">$0</p>
                    </div>
                    <div class="stat-card" id="card-utilidad" style="display:none; border-left-color: var(--gold);">
                        <h4>UTILIDAD NETA</h4>
                        <p id="stat-utilidad">$0</p>
                    </div>
                </div>

                <div id="admin-panel" class="panel" style="display:none;">
                    <h3 style="color: var(--accent);">📦 Inventario Maestro</h3>
                    <table class="inv-table">
                        <thead><tr><th>Prod</th><th>Costo</th><th>Venta</th><th>Stock</th><th>Code</th></tr></thead>
                        <tbody id="lista-inv"></tbody>
                    </table>
                    <button class="btn-ui" style="background: var(--accent); color: #000; margin-top:15px;" onclick="actualizarInv()">💾 GUARDAR CAMBIOS</button>
                </div>
            </div>

            <div class="ticket-section" id="area-impresion">
                <h3 style="text-align:center; margin:0;">CUEVA B</h3>
                <hr style="border: 1px dashed #000;">
                <div id="ticket-items" style="min-height: 100px; font-size: 13px;"></div>
                <div style="border-top: 2px solid #000; padding-top:10px; text-align:right; font-weight:bold; font-size:1.4rem;">
                    TOTAL: $<span id="ticket-total">0</span>
                </div>
                <div class="no-print">
                    <button class="btn-ui" style="background: var(--accent); color: #000; margin-top: 20px;" onclick="procesarCobro()">✅ COBRAR</button>
                    <div class="switch-container">
                        <span>¿IMPRIMIR TICKET?</span>
                        <input type="checkbox" id="check-print" checked>
                    </div>
                    <button onclick="limpiar()" style="background:none; border:none; color:red; cursor:pointer; width:100%; margin-top:10px;">CANCELAR</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script>
        const CATALOGO = [
            { id: 'p1', nombre: 'PresPeq', color: '#ffcc00' }, { id: 'p2', nombre: 'OnePeq', color: '#ff00ff' },
            { id: 'p3', nombre: 'Corona', color: '#0088ff' }, { id: 'p4', nombre: 'Smifnoff', color: '#f0f0f0' },
            { id: 'p5', nombre: 'Modelo', color: '#ff4400' }, { id: 'p6', nombre: 'PresMed', color: '#00ff88' },
            { id: 'p7', nombre: 'PresJum', color: '#9933ff' }, { id: 'p8', nombre: 'BruExtV1', color: '#ffcc00' },
            { id: 'p9', nombre: 'BruXV1Lt', color: '#ff00ff' }, { id: 'p10', nombre: 'BruDRes1', color: '#0088ff' },
            { id: 'p11', nombre: 'KPridPeq', color: '#f0f0f0' }, { id: 'p12', nombre: 'KPridMed', color: '#ff4400' },
            { id: 'p13', nombre: 'KPridGde', color: '#00ff88' }, { id: 'p14', nombre: 'VinoF1Lt', color: '#9933ff' },
            { id: 'p15', nombre: 'JugMotts', color: '#ff00ff' }, { id: 'p16', nombre: '911', color: '#0088ff' },
            { id: 'p17', nombre: 'Agua', color: '#f0f0f0' }, { id: 'p18', nombre: 'Soda', color: '#ff4400' },
            { id: 'p19', nombre: '7up', color: '#00ff88' }, { id: 'p20', nombre: 'GatorPeq', color: '#9933ff' }
        ];

        const firebaseConfig = {
            apiKey: "AIzaSyCbkHawWcvju2U-ehpvHkToQV0--qh6Ip0",
            authDomain: "mibarpos.firebaseapp.com",
            databaseURL: "https://mibarpos-default-rtdb.firebaseio.com",
            projectId: "mibarpos",
            appId: "1:492727911130:web:58bea15998a09420a39be3"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let dbData = { stock: {}, costos: {}, precios: {}, barcodes: {}, ventas: {} }; 
        let carrito = []; 
        let userRole = "";

        function entrarComo(role) {
            if(role === 'dueno' && prompt("PIN:") !== "020322") return;
            userRole = role;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            document.getElementById('user-display').innerText = role === 'dueno' ? "👤 PROPIETARIO" : "👤 VENDEDOR";
            
            if(role === 'dueno') {
                document.getElementById('admin-panel').style.display = 'block';
                document.getElementById('card-utilidad').style.display = 'block';
            }

            db.ref('negocio').on('value', snap => {
                const data = snap.val();
                if(data) {
                    dbData = data;
                    renderApp();
                    filtrarVentas(); 
                }
            });
        }

        function renderApp() {
            const grid = document.getElementById('grid-ventas');
            const inv = document.getElementById('lista-inv');
            grid.innerHTML = ""; inv.innerHTML = "";

            CATALOGO.forEach(p => {
                const st = Number(dbData.stock?.[p.id]) || 0;
                const pr = Number(dbData.precios?.[p.id]) || 0;
                const b = document.createElement('button');
                b.className = 'btn-prod'; b.style.background = p.color;
                if(['#f0f0f0', '#ffcc00', '#00ff88'].includes(p.color)) b.style.color = '#333';
                b.innerHTML = `${p.nombre}<br>$${pr}<span class="stock-badge">Stock: ${st}</span>`;
                b.onclick = () => sumarAlTicket(p);
                grid.appendChild(b);
                
                if(userRole === 'dueno') {
                    inv.innerHTML += `<tr><td>${p.nombre}</td>
                        <td><input type="number" id="c-${p.id}" value="${Number(dbData.costos?.[p.id]) || 0}"></td>
                        <td><input type="number" id="v-${p.id}" value="${pr}"></td>
                        <td><input type="number" id="s-${p.id}" placeholder="+0"></td>
                        <td><input type="text" id="b-${p.id}" value="${dbData.barcodes?.[p.id] || ""}"></td></tr>`;
                }
            });
        }

        function sumarAlTicket(p) {
            carrito.push(p);
            let totalActual = 0; 
            let htmlItems = "";
            carrito.forEach(item => {
                const precioItem = Number(dbData.precios?.[item.id]) || 0;
                totalActual += precioItem;
                htmlItems += `<div style="display:flex; justify-content:space-between; margin-bottom:4px;"><span>${item.nombre}</span><span>$${precioItem}</span></div>`;
            });
            document.getElementById('ticket-items').innerHTML = htmlItems;
            document.getElementById('ticket-total').innerText = totalActual;
        }

        function procesarCobro() {
            if(carrito.length === 0) return;
            const hoyISO = new Date().toISOString().split('T')[0];
            let ventaT = 0; let costoT = 0;
            
            carrito.forEach(p => {
                const v = Number(dbData.precios?.[p.id]) || 0;
                const c = Number(dbData.costos?.[p.id]) || 0;
                ventaT += v;
                costoT += c;
                db.ref(`negocio/stock/${p.id}`).set((Number(dbData.stock?.[p.id]) || 0) - 1);
            });

            db.ref('negocio/ventas').push({
                total: ventaT,
                ganancia: (ventaT - costoT),
                fecha_ISO: hoyISO
            }).then(() => {
                if(document.getElementById('check-print').checked) window.print();
                limpiar();
            });
        }

        function filtrarVentas() {
            const hoyISO = new Date().toISOString().split('T')[0];
            const inicio = document.getElementById('f-inicio').value || hoyISO;
            const fin = document.getElementById('f-fin').value || hoyISO;
            
            let sumaVenta = 0; 
            let sumaGana = 0;

            if(dbData.ventas) {
                Object.values(dbData.ventas).forEach(v => {
                    if(v && v.fecha_ISO >= inicio && v.fecha_ISO <= fin) {
                        sumaVenta += Number(v.total) || 0;
                        sumaGana += Number(v.ganancia) || 0;
                    }
                });
            }
            document.getElementById('stat-ingreso').innerText = `$${sumaVenta}`;
            if(userRole === 'dueno') document.getElementById('stat-utilidad').innerText = `$${sumaGana}`;
        }

        function actualizarInv() {
            let updates = {};
            CATALOGO.forEach(p => {
                updates[`costos/${p.id}`] = Number(document.getElementById(`c-${p.id}`).value) || 0;
                updates[`precios/${p.id}`] = Number(document.getElementById(`v-${p.id}`).value) || 0;
                updates[`barcodes/${p.id}`] = document.getElementById(`b-${p.id}`).value.trim();
                const stockAdd = Number(document.getElementById(`s-${p.id}`).value) || 0;
                if(stockAdd !== 0) updates[`stock/${p.id}`] = (Number(dbData.stock?.[p.id]) || 0) + stockAdd;
            });
            db.ref('negocio').update(updates).then(() => alert("✅ Cambios aplicados"));
        }

        function limpiar() {
            carrito = [];
            document.getElementById('ticket-items').innerHTML = "";
            document.getElementById('ticket-total').innerText = "0";
        }

        // SCANNER LISTENER
        let scannerBuffer = "";
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                if (scannerBuffer.length > 2) {
                    const codes = dbData.barcodes || {};
                    const foundId = Object.keys(codes).find(id => codes[id] === scannerBuffer);
                    if(foundId) sumarAlTicket(CATALOGO.find(p => p.id === foundId));
                    scannerBuffer = "";
                }
            } else if (e.key.length === 1) { scannerBuffer += e.key; }
            setTimeout(() => { scannerBuffer = ""; }, 400);
        });
    </script>
</body>
</html>
